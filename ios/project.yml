name: OSUFood
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  OSUFood:
    type: application
    platform: iOS
    sources:
      - path: OSUFood
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.osufood.demo
        INFOPLIST_KEY_CFBundleDisplayName: Food After Hours
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: OSUFood/Info.plist
      properties:
        CFBundleDisplayName: Food After Hours
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connect to the local classroom demo server to show listings and reservations.
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets: []
